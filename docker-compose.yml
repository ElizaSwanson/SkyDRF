version: '3.9'

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${NAME}
      POSTGRES_USER: ${USER}
      POSTGRES_PASSWORD: ${PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data/

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - '8000:8000'
    depends_on:
      - db
    env_file: .env

  redis:
    image: redis:alpine

  celery:
    build: .
    command: celery -A app worker -l info -p eventlet
    depends_on:
      - redis
      - db
    env_file: .env

  celery-beat:
    build: .
    command: celery -A app beat -l info
    depends_on:
      - redis
      - db
    env_file: .env

  nginx:
    build: .
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./html:/usr/share/nginx/html

volumes:
  postgres_data: